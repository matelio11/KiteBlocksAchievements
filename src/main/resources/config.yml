# KiteBlocks Achievements - GUI and rewards blueprint
# IMPORTANT: This is a valid YAML design, NOT a plug-and-play config for a known plugin.
# A matching Paper achievements plugin must implement menus, tracking, claims, and API rewards.
# Missing screenshot tiers are null/empty, intentionally.
# Crate key IDs must match your actual ExcellentCrates IDs (case-sensitive).
config_version: KiteBlocks-Achievements-Blueprint-1.0
description: GUI/config design reference; requires an achievements plugin implementing this schema.
commands:
  player:
  - achievements
  - ach
  admin:
  - kba admin
gui:
  title: '&dKiteBlocks &8» &fAchievements'
  rows: 6
  fill: GRAY_STAINED_GLASS_PANE
  category_click: LEFT
  tier_claim: RIGHT
  category_slots:
    playtime: 10
    boss_damage: 11
    mining: 12
    pvp_kills: 13
    fishing: 14
    farming: 15
    mcmmo_levels: 16
    earn_money: 21
    mob_grinding: 22
  tier_view:
    title: '&dKiteBlocks &8» &f%category%'
    rows: 6
    back_slot: 49
    next_slot: 53
    previous_slot: 45
    tier_slots_first_page:
    - 10
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    - 19
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
    - 28
    - 29
    - 30
    - 31
    - 32
    - 33
  tier_tooltip:
    locked:
    - '&dTier %tier%'
    - '&7Requirement: &f%progress%&7/&f%requirement%'
    - '&7Rewards:'
    - '%rewards%'
    - '&cNot unlocked yet'
    ready:
    - '&dTier %tier%'
    - '&aCompleted!'
    - '&7Rewards:'
    - '%rewards%'
    - '&eRight-Click to claim!'
    claimed:
    - '&dTier %tier%'
    - '&aClaimed'
    - '&7Rewards:'
    - '%rewards%'
  fly_info:
    slot: 40
    material: FEATHER
    name: '&bFly Command'
    lore:
    - '&7Unlock through Playtime Tier 10'
    - '&eRight-click to claim /fly access'
    - '&7Requires EssentialsX permission: essentials.fly'
    click: RIGHT
    claim_permission: essentials.fly
progress:
  separate_per_player: true
  claim_once_per_tier: true
  server_authoritative: true
  playtime_counts_minutes: true
  prevent_creative_farming_exploits: true
economy:
  xp: MultiCurrency custom XP (must integrate via its API)
  credits: PlayerPoints
  money: Vault / EssentialsX
crate_keys:
  vote: Vote
  pvp: PvP
  lucky: Lucky
  royal: Royal
crate_key_command_template: cratekey give %player% %key_id% %amount%
reward_commands:
  credits: points give %player% %amount%
  money: eco give %player% %amount%
  fly_permission: lp user %player% permission set essentials.fly true
  xp: REQUIRES_MULTICURRENCY_API_INTEGRATION
