- Some screenshots did not include every category or tier; missing ones are deliberately left blank.
- OPBlocks Shield/Cannon/Cavalry keys were changed to PvP/Lucky/Royal respectively.
- OPBlocks Spawner Key replaced with Royal Key because requested keys are only Vote/PvP/Lucky/Royal.
- Playtime Tier 10 grants permanent /fly as an optional design choice; adjust if desired.
- All commands are dispatched as console commands by the eventual plugin, not by YAML alone.
